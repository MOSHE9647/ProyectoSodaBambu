name: CI/CD Pipeline

on:
    push:
        branches: [ "main", "dev", "feature/*", "release/*" ]
    pull_request:
        branches: [ "main", "dev" ]

env:
    VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
    # STEP 1: Linting
    lint:
        name: Fix Code Style
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                php: [8.4]
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: ${{ matrix.php }}
                tools: pint

            - name: Run Pint
              run: pint

            - name: Commit linted files
              uses: stefanzweifel/git-auto-commit-action@v6
              with:
                commit_message: Fixed code style with Laravel Pint

    # STEP 2: Testing (Laravel)
    laravel-tests:
        name: Laravel Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: source_code
        env:
            APP_ENV: testing
            DB_CONNECTION: sqlite
            DB_DATABASE: database/database.sqlite
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: "8.4"
                coverage: xdebug

            - name: Install Dependencies
              run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: lts/*
                cache: "npm"
                cache-dependency-path: source_code/package-lock.json

            - name: Directory Permissions
              run: chmod -R 777 storage bootstrap/cache

            - name: Run CI bootstrap
              run: composer run ci

            - name: Run Tests
              run: php artisan test --ci --parallel --compact

    # STEP 3: Deploy to Vercel (only if Linting and Testing succeed)
    deploy-preview:
        name: Deploy to Vercel (Preview)
        needs: [lint, laravel-tests] # <-- This ensures deployment only happens if linting and testing succeed

        # Only deploy if the branch is not 'main' (i.e., for feature branches, dev, and release branches)
        if: github.ref != 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install Vercel CLI
              run: npm install --global vercel@latest

            - name: Pull Vercel Environment Information
              run: vercel pull --yes --environment=preview
              
            - name: Deploy Project Artifacts to Vercel
              run: |
                PREVIEW_URL=$(vercel deploy)
                echo "Despliegue exitoso en Vercel. URL de vista previa: $PREVIEW_URL"
                echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV

            # Email notification for deployment status
            # ---- Success Email Preparation and Notification ----
            - name: Prepare Success Email Template
              if: success()
              run: |
                export DEPLOY_ENV="Vista Previa (Preview)"
                export DEPLOY_URL="${{ env.PREVIEW_URL }}"
                envsubst < .github/templates/deploy-success.html > email-success.html

            - name: Notify Success via Email
              if: success()
              uses: dawidd6/action-send-mail@v3
              with:
                server_address: ${{ secrets.EMAIL_SERVER_ADDRESS }}
                server_port: 587
                username: ${{ secrets.EMAIL_USERNAME }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "Despliegue Exitoso a Vercel (Preview) | Soda El Bambú"
                to: ${{ secrets.EMAIL_RECIPIENT }}
                from: "CI/CD Pipeline <ci-cd-helper@${{ secrets.EMAIL_USERNAME }}>"
                html_body: file://email-success.html

            # ---- Failure Email Preparation and Notification ----
            - name: Prepare Error Email Template
              if: failure()
              run: |
                  export DEPLOY_ENV="Vista Previa (Preview)"
                  envsubst < .github/templates/deploy-error.html > email-error.html

            - name: Notify Failure via Email
              if: failure()
              uses: dawidd6/action-send-mail@v3
              with:
                server_address: ${{ secrets.EMAIL_SERVER_ADDRESS }}
                server_port: 587
                username: ${{ secrets.EMAIL_USERNAME }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "Despliegue Fallido a Vercel (Preview) | Soda El Bambú"
                to: ${{ secrets.EMAIL_RECIPIENT }}
                from: "CI/CD Pipeline <ci-cd-helper@${{ secrets.EMAIL_USERNAME }}>"
                html_body: file://email-error.html

    # STEP 4: Deploy to Vercel (Production)
    deploy-production:
        name: Deploy to Vercel (Production)
        needs: [lint, laravel-tests] # <-- This ensures deployment only happens if linting and testing succeed

        # Only deploy if the branch is 'main' and the event is a push (not a pull request)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install Vercel CLI
              run: npm install --global vercel@latest

            - name: Pull Vercel Environment Information
              run: vercel pull --yes --environment=production

            - name: Deploy Project Artifacts to Vercel
              run: |
                PROD_URL=$(vercel deploy --prod)
                echo "Despliegue exitoso en Vercel. URL de producción: $PROD_URL"
                echo "PROD_URL=$PROD_URL" >> $GITHUB_ENV

            # Email notification for deployment status
            # ---- Success Email Preparation and Notification ----
            - name: Prepare Success Email Template
              if: success()
              run: |
                export DEPLOY_ENV="Producción"
                export DEPLOY_URL="${{ env.PROD_URL }}"
                envsubst < .github/templates/deploy-success.html > email-success.html
            
            - name: Notify Success via Email
              if: success()
              uses: dawidd6/action-send-mail@v3
              with:
                server_address: ${{ secrets.EMAIL_SERVER_ADDRESS }}
                server_port: 587
                username: ${{ secrets.EMAIL_USERNAME }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "Despliegue Exitoso a Vercel (Producción) | Soda El Bambú"
                to: ${{ secrets.EMAIL_RECIPIENT }}
                from: "CI/CD Pipeline <ci-cd-helper@${{ secrets.EMAIL_USERNAME }}>"
                html_body: file://email-success.html

            # ---- Failure Email Preparation and Notification ----
            - name: Prepare Error Email Template
              if: failure()
              run: |
                  export DEPLOY_ENV="Producción"
                  envsubst < .github/templates/deploy-error.html > email-error.html
            
            - name: Notify Failure via Email
              if: failure()
              uses: dawidd6/action-send-mail@v3
              with:
                server_address: ${{ secrets.EMAIL_SERVER_ADDRESS }}
                server_port: 587
                username: ${{ secrets.EMAIL_USERNAME }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                subject: "Despliegue Fallido a Vercel (Producción) | Soda El Bambú"
                to: ${{ secrets.EMAIL_RECIPIENT }}
                from: "CI/CD Pipeline <ci-cd-helper@${{ secrets.EMAIL_USERNAME }}>"
                html_body: file://email-error.html